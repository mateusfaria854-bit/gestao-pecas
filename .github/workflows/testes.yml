name: Testes da demonstração

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar bundle e executar testes unitários
        run: |
          npm run build
          npm test
          npm run spec:check
          npm run arch:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Ubuntu 24.04 no GitHub Actions já inclui Chromium e suas bibliotecas.
      # Evita downloads APT que podem falhar temporariamente com HTTP 503.
      - name: Instalar Playwright e usar Chromium do runner
        shell: bash
        run: |
          python -m pip install playwright==1.57.0
          CHROME_BIN="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chromium/Chrome não encontrado no runner ubuntu-24.04"
            exit 1
          fi
          echo "CHROMIUM_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          CHROMIUM_BIN="$CHROME_BIN" python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser = pw.chromium.launch(
                  headless=True,
                  executable_path=os.environ["CHROMIUM_BIN"],
                  args=["--no-sandbox", "--no-proxy-server"],
              )
              print("Navegador iniciado:", browser.version)
              browser.close()
          PY
      - name: Testes integrados de regressão
        run: |
          python tests/test_demo.py
          python tests/test_melhorias.py
